name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ "README.md" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build release APK
        run: |
          set +e
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |What went wrong|Could not (resolve|find)|> .*(error|failed)|FAILED|AssertionError|expected:" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      # Not needed for the build: shows (in the run summary) which flyers near Oslo carry makeup.
      - name: Check the flyers
        continue-on-error: true
        run: |
          c=$(curl -sS -m 20 "https://squid-api.tjek.com/v2/catalogs?r_lat=59.9133&r_lng=10.7389&r_radius=30000&r_locale=nb_NO&api_av=0.3.0&limit=100&types=paged,incito")
          echo "::notice title=Flyers near Oslo::$(echo "$c" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(len(d),"catalogs:",[((x.get("branding") or {}).get("name"),x.get("offer_count")) for x in d][:40])' 2>&1 | head -c 1500)"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Sminkeliste-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sminkeliste-apk
          path: Sminkeliste-*.apk

      # The app checks this release on start and installs it by itself.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sminkeliste v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Built by hand from the Actions tab.' }}
          files: Sminkeliste-*.apk
          make_latest: true
