name: Probe web shops
on:
  workflow_dispatch:
  push:
    paths: [ "tools/**", "app/src/main/assets/extract.js", ".github/workflows/probe.yml" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/browser_probe.py "maybelline mascara" "huda beauty blush"
